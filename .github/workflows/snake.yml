name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Wilykun
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark
      - name: Push snake SVG
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution snake"
          add: "assets/github-snake*.svg"
